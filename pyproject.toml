[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lotuspod"
version = "0.4.0"
description = "Lotuspod: publish pages people comment on, with decision forms and agents that answer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
lotuspod = "lotuspod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lotuspod = ["py.typed", "_templates/*.html", "_theme/*.json", "_theme/*.svg", "_theme/css/*.css", "_theme/js/*.js"]
