[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lotuspod"
version = "0.1.0"
description = "Lotuspod - podcast artifact scaffold with a shared lotus theme."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
lotuspod = "lotuspod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lotuspod = ["py.typed", "_templates/*.html", "_theme/*.css", "_theme/*.json", "_theme/*.svg", "_theme/*.js"]
