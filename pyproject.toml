[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lotuspod"
version = "0.6.0"
description = "Lotuspod: publish pages people comment on, with decision forms and agents that answer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
lotuspod = "lotuspod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Recursive globs over core/ and every slice: its theme parts declaration, its
# theme/, its templates/ and the built .js in its ts/ (never a .ts source), so
# a new theme file or slice takes no line here.
lotuspod = ["py.typed", "core/theme_parts.json", "core/templates/**/*.html", "core/theme/**/*",
            "core/ts/**/*.js", "features/*/theme_parts.json", "features/*/templates/**/*.html",
            "features/*/theme/**/*", "features/*/ts/**/*.js"]
