[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lotuspod"
version = "0.6.0"
description = "Lotuspod: publish pages people comment on, with decision forms and agents that answer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
lotuspod = "lotuspod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lotuspod = ["py.typed", "_theme/*.js", "_theme/css/*.css",
            "core/templates/*.html", "core/theme/*.css", "core/theme/*.json", "core/theme/*.svg",
            "core/ts/*.js", "features/blocks/theme/*.css", "features/blocks/ts/*.js",
            "features/comments/theme/*.css", "features/comments/ts/*.js",
            "features/decisions/theme/*.css", "features/decisions/ts/*.js",
            "features/history/theme/*.css", "features/history/ts/*.js",
            "features/index/templates/*.html", "features/index/theme/*.css",
            "features/index/ts/*.js", "features/live/theme/*.css", "features/live/ts/*.js",
            "features/publish/theme/*.css", "features/publish/ts/*.js",
            "features/widgets/theme/*.css", "features/widgets/ts/*.js"]
