name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: release check
        run: python ci/release_check.py "$GITHUB_REF_NAME" > notes.md
      - name: leak guard
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: python ci/leak_guard.py "$GITHUB_REF_NAME^" "$GITHUB_REF_NAME"
      - run: pip install -e .
      - run: python -m unittest discover -s tests
      - run: python -m pip install build
      - run: python -m build
      - run: bash ci/install_smoke.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; a re-run keeps it"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md --verify-tag
          fi
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
