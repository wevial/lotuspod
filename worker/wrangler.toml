# The Worker that serves the exported pages. Account ids, database ids,
# routes and hostnames are deliberately absent: they arrive from the
# provisioned inventory by a separate hand change. The gate's settings
# (ACCESS_TEAM_DOMAIN, ACCESS_AUD, ALLOWED_EMAIL, MACHINE_CLIENT_ID) are
# environment settings and CSRF_SECRET is a Worker secret, all supplied at
# provisioning, never committed here.
name = "lotuspod"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "../publish"
binding = "ASSETS"
run_worker_first = true
