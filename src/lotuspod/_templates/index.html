<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotuspod</title>
  <meta name="generator" content="lotuspod theme {{theme_name}}">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="lotuspod.css?v={{theme_hash}}">
</head>
<body>
  <main class="index">
    <header class="index-header">
      <h1 class="index-title">Lotuspod <span class="index-updated">updated <time datetime="{{generated}}">{{generated}}</time></span></h1>
    </header>

    <section class="index-body">
      <div class="index-controls" hidden>
        <label class="index-search-label" for="index-search">Search</label>
        <input id="index-search" class="index-search" type="search" autocomplete="off"
               spellcheck="false" placeholder="Search pages by title, date or summary">
        <div class="index-labels-menu" hidden>
          <button type="button" class="index-labels" aria-haspopup="true" aria-expanded="false"
                  aria-controls="index-labels-list">Labels &#9662;</button>
          <div class="index-labels-list" id="index-labels-list" role="group"
               aria-label="Labels" hidden></div>
        </div>
        <p class="index-count" role="status" aria-live="polite"></p>
      </div>
      <p class="index-active" hidden>Showing</p>

      {{entries_block}}

      <p class="index-empty index-no-match" hidden>No pages match these filters.</p>
    </section>

    <footer class="artifact-footer">
      <span aria-hidden="true">&#10047;</span> lotuspod
    </footer>
  </main>

  <script>
    // Progressive enhancement over a listing that is already complete: the table
    // above stands on its own, and this adds sorting and the search filter on
    // top. The search field ships hidden and is revealed here, so a reader
    // without scripting never sees a control that cannot filter anything. So
    // does the Labels menu, built from the labels the rows carry. Signed in,
    // the seen route says which pages were republished since this reader last
    // opened them: each gets an "updated" mark, and an Updated toggle keeps
    // only those. Any other answer (signed out, the demo) leaves neither.
    (() => {
      const table = document.querySelector(".index-table");
      if (!table) return;

      const body = table.tBodies[0];
      const headers = Array.from(table.tHead.rows[0].cells);
      // Document order is newest update first, filename breaking ties - the
      // listing's stable base. Sorts run from it rather than from the current
      // DOM order, so a sort is repeatable and equal keys keep falling back to
      // that order.
      const rows = Array.from(body.rows);

      // A date cell sorts by its time element's full datetime, not the day it
      // shows, so two pages updated on one day keep their order. A title
      // sorts by its link, not the tags under it.
      const cell = (row, column) => {
        const time = row.cells[column].querySelector("time[datetime]");
        if (time) return time.dateTime;
        const link = row.cells[column].querySelector("a");
        return (link || row.cells[column]).textContent.trim();
      };

      const sorted = (column, ascending) => {
        const dated = rows.some((row) => row.cells[column].querySelector("time[datetime]"));
        const direction = ascending ? 1 : -1;
        return rows.slice().sort((a, b) => {
          const left = cell(a, column);
          const right = cell(b, column);
          // Blanks (no date, no summary) sink in both directions, so the rows
          // that carry the field stay together at the top either way.
          if (!left || !right) return left ? -1 : right ? 1 : 0;
          // ISO 8601 in UTC orders as text.
          if (dated) return (left < right ? -1 : left > right ? 1 : 0) * direction;
          return left.localeCompare(right, undefined, {
            numeric: true,
            sensitivity: "base",
          }) * direction;
        });
      };

      // The rows arrive in the order a header may already name: its next click
      // reverses it.
      let sortColumn = headers.findIndex((header) => header.hasAttribute("aria-sort"));
      let ascending = sortColumn >= 0 && headers[sortColumn].getAttribute("aria-sort") === "ascending";

      // The order the rows arrive in, which the count names while it holds.
      const arrival = { column: sortColumn, ascending };

      const sortBy = (column) => {
        ascending = column === sortColumn ? !ascending : true;
        sortColumn = column;
        for (const row of sorted(column, ascending)) body.append(row);
        headers.forEach((header, index) => {
          header.setAttribute(
            "aria-sort",
            index !== column ? "none" : ascending ? "ascending" : "descending"
          );
        });
        filter();
      };

      // The header label becomes a button so the sort is reachable by keyboard;
      // aria-sort carries the state, and the theme draws the arrow from it.
      headers.forEach((header, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "sort-button";
        button.textContent = header.textContent;
        button.addEventListener("click", () => sortBy(index));
        header.textContent = "";
        header.append(button);
        if (index !== sortColumn) header.setAttribute("aria-sort", "none");
      });

      const controls = document.querySelector(".index-controls");
      const search = document.querySelector(".index-search");
      const count = document.querySelector(".index-count");
      const noMatch = document.querySelector(".index-no-match");
      const menu = document.querySelector(".index-labels-menu");
      const toggle = document.querySelector(".index-labels");
      const list = document.querySelector(".index-labels-list");
      const active = document.querySelector(".index-active");

      // Each row's text as the index wrote it, before any mark, for the search.
      const textOf = new Map(rows.map((row) => [row, row.textContent.toLowerCase()]));

      // Each row's labels, from the data-labels the index writes.
      const labelsOf = new Map(rows.map((row) => [
        row,
        (row.dataset.labels || "").split(",").filter(Boolean),
      ]));

      // One checkbox per label any row carries, A to Z, with its page count.
      const counts = new Map();
      for (const labels of labelsOf.values()) {
        for (const label of labels) counts.set(label, (counts.get(label) || 0) + 1);
      }
      const boxes = Array.from(counts.keys()).sort().map((label) => {
        const option = document.createElement("label");
        option.className = "index-labels-option";
        const box = document.createElement("input");
        box.type = "checkbox";
        box.value = label;
        const name = document.createElement("span");
        name.className = "index-labels-name";
        name.textContent = label;
        const number = document.createElement("span");
        number.className = "index-labels-count";
        number.textContent = counts.get(label);
        option.append(box, name, number);
        list.append(option);
        box.addEventListener("change", () => filter());
        return box;
      });

      const open = (shown) => {
        list.hidden = !shown;
        toggle.setAttribute("aria-expanded", String(shown));
      };

      toggle.addEventListener("click", () => open(list.hidden));
      // Escape closes the open menu wherever focus has gone, the search too.
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !list.hidden) {
          event.preventDefault();
          open(false);
          toggle.focus();
        }
      });
      // A click elsewhere closes the menu and returns focus to the button, as
      // Escape does, wherever the click landed.
      document.addEventListener("click", (event) => {
        if (list.hidden || menu.contains(event.target)) return;
        open(false);
        toggle.focus();
      });

      // The rows republished since this reader last opened them, and the
      // Updated toggle, made once the seen route first answers 200.
      const marked = new Set();
      let updated = null;

      // A token per active filter, each checked label then the Updated
      // toggle: pressing it releases that filter, and focus moves to the
      // token that takes its place, else the filter's own button.
      const showTokens = (checked, pressed) => {
        active.replaceChildren("Showing");
        const releases = checked.map((label) => [label, toggle, () => {
          boxes.find((box) => box.value === label).checked = false;
        }]);
        if (pressed) {
          releases.push(["updated", updated, () => updated.setAttribute("aria-pressed", "false")]);
        }
        releases.forEach(([label, button, release], index) => {
          const token = document.createElement("button");
          token.type = "button";
          token.className = "index-token";
          token.textContent = `${label} \u2715`;
          token.setAttribute("aria-label", `Remove filter ${label}`);
          token.addEventListener("click", () => {
            release();
            filter();
            const tokens = active.querySelectorAll(".index-token");
            (tokens[index] || tokens[index - 1] || button).focus();
          });
          active.append(" ", token);
        });
        active.hidden = releases.length === 0;
      };

      // Every test in one pass over the rows: a row is kept when no label is
      // checked or it carries a checked one, when Updated is not pressed or
      // it is marked, and when the search - one case-insensitive substring
      // test against the whole row as written, labels included - matches it.
      const filter = () => {
        const query = search.value.trim().toLowerCase();
        const checked = boxes.filter((box) => box.checked).map((box) => box.value);
        const pressed = updated !== null && updated.getAttribute("aria-pressed") === "true";
        let shown = 0;
        for (const row of rows) {
          const labelled = checked.length === 0 ||
            labelsOf.get(row).some((label) => checked.includes(label));
          const fresh = !pressed || marked.has(row);
          const found = !query || textOf.get(row).includes(query);
          const match = labelled && fresh && found;
          row.hidden = !match;
          if (match) shown += 1;
        }
        const noun = rows.length === 1 ? "page" : "pages";
        const arrived = sortColumn === arrival.column && ascending === arrival.ascending;
        // Any active filter counts against the whole listing, even when every
        // row passes it.
        const filtered = checked.length > 0 || pressed || query !== "";
        count.textContent =
          !filtered
            ? arrived && sortColumn >= 0
              ? `${rows.length} ${noun}, newest update first`
              : `${rows.length} ${noun}`
            : `${shown} of ${rows.length} ${noun}`;
        toggle.textContent = checked.length
          ? `Labels (${checked.length}) \u25BE`
          : "Labels \u25BE";
        showTokens(checked, pressed);
        table.hidden = shown === 0;
        noMatch.hidden = shown > 0;
      };

      // Mark each row whose page was republished since this reader last
      // opened it, from the seen route's {pages: {NAME: {revision, seen}}}; a
      // page never opened is not marked. Without an answer of 200 there are
      // no marks and no toggle.
      const showSeen = (pages) => {
        for (const mark of body.querySelectorAll(".index-mark")) mark.remove();
        marked.clear();
        if (!pages) {
          if (updated) updated.remove();
          updated = null;
          filter();
          return;
        }
        for (const row of rows) {
          const entry = Object.prototype.hasOwnProperty.call(pages, row.dataset.page || "")
            ? pages[row.dataset.page] : null;
          if (!entry || typeof entry.seen !== "string" || entry.seen === entry.revision) continue;
          marked.add(row);
          const mark = document.createElement("span");
          mark.className = "index-mark";
          mark.textContent = "updated";
          const link = row.cells[0].querySelector("a");
          if (link) link.after(mark);
        }
        if (!updated) {
          updated = document.createElement("button");
          updated.type = "button";
          updated.className = "index-toggle";
          updated.setAttribute("aria-pressed", "false");
          updated.addEventListener("click", () => {
            const pressed = updated.getAttribute("aria-pressed") === "true";
            updated.setAttribute("aria-pressed", String(!pressed));
            filter();
          });
          menu.after(updated);
        }
        updated.textContent = `Updated \u00B7 ${marked.size}`;
        filter();
      };

      const askSeen = async () => {
        let pages = null;
        try {
          const response = await fetch("/api/seen", { cache: "no-store" });
          if (response.status === 200) {
            const payload = await response.json();
            if (payload && typeof payload.pages === "object" && payload.pages) pages = payload.pages;
          }
        } catch (ignored) {
          // Shown as if the route had not answered.
        }
        showSeen(pages);
      };

      search.addEventListener("input", filter);
      menu.hidden = boxes.length === 0;
      controls.hidden = false;
      filter();
      askSeen();
      // Back from a page through the back-forward cache, the index is the one
      // it was: ask again, so a page just read loses its mark.
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) askSeen();
      });
    })();
  </script>
</body>
</html>
