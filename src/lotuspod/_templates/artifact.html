<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Lotuspod</title>
  <meta name="generator" content="lotuspod theme {{theme_name}} v{{theme_version}}">
  <meta name="lotuspod:visible" content="{{visible}}">
  <link rel="stylesheet" href="lotuspod.css?v={{theme_version}}">
</head>
<body>
  <main class="artifact">
    <nav class="artifact-nav">
      <a href="index.html"><span aria-hidden="true">&#8592;</span> Lotuspod</a>
    </nav>

    <header class="artifact-header">
      <p class="artifact-kicker">{{kicker}}</p>
      <h1 class="artifact-title">{{title}}</h1>
      <p class="artifact-meta"><time datetime="{{date}}">{{date}}</time></p>
      {{summary_block}}
    </header>

    <div class="artifact-main">
      {{#outline}}<nav class="artifact-outline" aria-label="On this page">
        <details class="artifact-outline-disclosure">
          <summary class="artifact-outline-summary">On this page</summary>
          <ol class="artifact-outline-list" role="list">
{{outline_items}}
          </ol>
        </details>
      </nav>{{/outline}}

      <section class="artifact-body">
        {{body}}
      </section>
    </div>

    <footer class="artifact-footer">
      <span aria-hidden="true">&#10047;</span> lotuspod
    </footer>
  </main>
</body>
</html>
